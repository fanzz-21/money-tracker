<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catat Transaksi — Kas Harian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="js/pwa.js?v=1"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/ui.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="lk-header">
    <div class="lk-header-inner">
      <a href="index.html" class="flex items-center gap-2 min-w-0">
        <span class="material-symbols-outlined text-xl">arrow_back</span>
        <h1 class="text-lg font-semibold truncate">Catat Transaksi</h1>
      </a>
      <button type="button" data-theme-toggle class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors" aria-label="Ganti tema">
        <span class="material-symbols-outlined text-xl" data-theme-icon>dark_mode</span>
      </button>
    </div>
  </header>

  <main class="flex-1 lk-page lk-stack" style="max-width:640px">
    <form id="tx-form" class="lk-card p-5 md:p-6 lk-stack min-w-0" style="gap:1.25rem" novalidate>

      <div>
        <h2 class="text-sm font-semibold text-[var(--lk-text-muted)] uppercase tracking-wide mb-3">Jenis</h2>
        <div class="lk-grid-2" role="radiogroup" aria-label="Pilih jenis">
          <label class="lk-type-card relative cursor-pointer" data-type="in">
            <input type="radio" name="type" value="in" class="sr-only peer" required />
            <div class="lk-type-inner p-4 rounded-lg border-2 border-[var(--lk-border)] peer-checked:border-[var(--lk-success)] peer-checked:bg-[var(--lk-success)]/10 transition-all text-center">
              <span class="material-symbols-outlined text-3xl lk-text-success mb-2 block">call_received</span>
              <span class="font-medium">Dana Masuk</span>
              <p class="text-xs text-[var(--lk-text-muted)] mt-1">Gaji, usaha, transfer</p>
            </div>
          </label>
          <label class="lk-type-card relative cursor-pointer" data-type="out">
            <input type="radio" name="type" value="out" class="sr-only peer" />
            <div class="lk-type-inner p-4 rounded-lg border-2 border-[var(--lk-border)] peer-checked:border-[var(--lk-danger)] peer-checked:bg-[var(--lk-danger)]/10 transition-all text-center">
              <span class="material-symbols-outlined text-3xl lk-text-danger mb-2 block">call_made</span>
              <span class="font-medium">Dana Keluar</span>
              <p class="text-xs text-[var(--lk-text-muted)] mt-1">Makan, transport, tagihan</p>
            </div>
          </label>
        </div>
        <p id="err-type" class="lk-text-error text-sm mt-2 hidden"></p>
      </div>

      <div>
        <label for="amount" class="block text-sm font-medium mb-1.5">Jumlah</label>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--lk-text-muted)] pointer-events-none">Rp</span>
          <input id="amount" name="amount" type="number" inputmode="numeric" min="1" step="100" required
            placeholder="50.000" style="padding-left:2.25rem" />
        </div>
        <p id="err-amount" class="lk-text-error text-sm mt-1.5 hidden"></p>
      </div>

      <div>
        <label for="category" class="block text-sm font-medium mb-1.5">Kategori</label>
        <select id="category" name="category" required>
          <option value="" disabled selected>Pilih kategori</option>
        </select>
        <div id="budget-row" class="hidden mt-2 flex items-center justify-between gap-2 text-xs">
          <div class="min-w-0 flex-1">
            <div class="flex items-center justify-between mb-1">
              <span class="text-[var(--lk-text-muted)]">Budget bulan ini</span>
              <span id="budget-text" class="tabular-nums font-medium"></span>
            </div>
            <div class="h-1.5 rounded-full bg-[var(--lk-border)] overflow-hidden">
              <div id="budget-bar" class="h-full transition-all" style="width:0%;background:var(--lk-success)"></div>
            </div>
          </div>
          <button type="button" id="btn-budget-set" class="lk-btn-secondary text-xs shrink-0" style="padding:0.35rem 0.6rem">Set</button>
        </div>
        <p id="err-category" class="lk-text-error text-sm mt-1.5 hidden"></p>
      </div>

      <div>
        <label for="note" class="block text-sm font-medium mb-1.5">Keterangan <span class="text-[var(--lk-text-faint)] font-normal">(opsional)</span></label>
        <textarea id="note" name="note" rows="2" placeholder="Catatan tambahan..." maxlength="200"></textarea>
        <p class="text-xs text-[var(--lk-text-faint)] mt-1 text-right"><span id="note-count">0</span>/200</p>
      </div>

      <div>
        <label for="date" class="block text-sm font-medium mb-1.5">Tanggal</label>
        <input id="date" name="date" type="date" required />
        <p id="err-date" class="lk-text-error text-sm mt-1.5 hidden"></p>
      </div>

      <div class="pt-2 lk-stack" style="gap:0.5rem">
        <button type="submit" id="btn-save" class="lk-btn-primary w-full flex items-center justify-center gap-2" style="padding:0.75rem">
          <span class="material-symbols-outlined" data-btn-icon>save</span>
          <span data-btn-label>Simpan Transaksi</span>
        </button>
        <button type="button" id="btn-save-add" class="lk-btn-secondary w-full text-sm">
          + Simpan & tambah lagi
        </button>
        <a href="index.html" class="text-center text-sm text-[var(--lk-text-muted)] hover:text-[var(--lk-primary)] py-2">
          ← Kembali ke Dasbor
        </a>
      </div>
    </form>
  </main>

  <div id="toast" class="lk-toast hidden" role="status" aria-live="polite"></div>

  <script>
    window.LK_CONFIG = {
      url: "https://begnlasmgmobpyebzgsc.supabase.co",
      key: "sb_publishable_AFDwKgE47-P3Z6TyxKYp-A_j_5JaZtD"
    };
    window.LK_CACHE_BUST = Date.now();
  </script>
  <script src="js/theme.js?v=3"></script>
  <script src="js/ready.js?v=3"></script>
  <script type="module" src="js/supabase.js?v=3"></script>
  <script type="module" src="js/auth.js?v=3"></script>
  <script type="module" src="js/storage.js?v=4"></script>
  <script type="module" src="js/realtime.js?v=1"></script>
  <script src="js/notify.js?v=4"></script>
  <script type="module" src="js/budget.js?v=1"></script>
  <script src="js/input.js?v=4"></script>
</body>
</html>
