<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riwayat — Kas Harian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <script src="js/pwa.js?v=1"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="stylesheet" href="css/ui.css" />
</head>
<body class="min-h-screen flex flex-col">
  <header class="lk-header">
    <div class="lk-header-inner">
      <a href="index.html" class="flex items-center gap-2 min-w-0">
        <span class="material-symbols-outlined text-xl">arrow_back</span>
        <h1 class="text-lg font-semibold truncate">Riwayat Transaksi</h1>
      </a>
      <button type="button" data-theme-toggle class="p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors" aria-label="Ganti tema">
        <span class="material-symbols-outlined text-xl" data-theme-icon>dark_mode</span>
      </button>
    </div>
  </header>

  <main class="flex-1 lk-page lk-stack" style="gap:1rem">
    <!-- Filter -->
    <section class="lk-card p-4 min-w-0">
      <h2 class="text-sm font-semibold text-[var(--lk-text-muted)] uppercase tracking-wide mb-3">Filter & Ekspor</h2>
      <div class="lk-row">
        <select id="filter-month" style="flex:1 1 10rem;min-width:9rem">
          <option value="">Semua bulan</option>
        </select>
        <select id="filter-type" style="flex:0 1 9rem">
          <option value="">Semua jenis</option>
          <option value="in">Masuk</option>
          <option value="out">Keluar</option>
        </select>
        <input id="search-note" type="search" placeholder="Cari keterangan..." style="flex:2 1 12rem" />
        <button id="btn-export-csv" class="lk-btn-secondary text-sm flex items-center gap-1" style="flex:0 0 auto" title="Ekspor hasil filter ke CSV">
          <span class="material-symbols-outlined text-lg">download</span>
          <span class="hidden sm:inline">CSV</span>
        </button>
      </div>
    </section>

    <!-- Summary bar -->
    <section>
      <div class="flex flex-wrap items-center gap-x-5 gap-y-1 text-sm" id="summary-bar">
        <span id="sum-count" class="text-[var(--lk-text-muted)]">0 transaksi</span>
        <span id="sum-total-in" class="lk-money-in">Masuk: Rp 0</span>
        <span id="sum-total-out" class="lk-money-out">Keluar: Rp 0</span>
        <span id="sum-total-net" class="lk-money-net">Saldo: Rp 0</span>
      </div>
    </section>

    <!-- Backup & Restore -->
    <section class="lk-card p-4 min-w-0">
      <h2 class="text-sm font-semibold text-[var(--lk-text-muted)] uppercase tracking-wide mb-3">Backup & Restore</h2>
      <div class="lk-row">
        <button id="btn-export-json" class="lk-btn-secondary text-sm flex items-center gap-1" style="flex:1 1 12rem">
          <span class="material-symbols-outlined text-lg">cloud_download</span>
          <span>Download backup (.json)</span>
        </button>
        <label class="lk-btn-secondary text-sm flex items-center gap-1 cursor-pointer" style="flex:1 1 12rem">
          <span class="material-symbols-outlined text-lg">cloud_upload</span>
          <span>Restore dari .json</span>
          <input id="import-file" type="file" accept="application/json,.json" class="hidden" />
        </label>
        <button id="btn-reset" class="lk-btn-danger-ghost text-sm flex items-center gap-1" style="flex:0 0 auto" title="Hapus SEMUA transaksi Anda (tidak bisa dibatalkan)">
          <span class="material-symbols-outlined text-lg">delete_sweep</span>
          <span class="hidden sm:inline">Hapus semua</span>
        </button>
      </div>
      <p class="text-xs text-[var(--lk-text-faint)] mt-2">
        Backup berisi semua transaksi Anda. Restore menambahkan data baru (tidak menimpa).
      </p>
    </section>

    <!-- List -->
    <section class="lk-stack min-w-0">
      <h2 class="text-lg font-semibold">Daftar Transaksi</h2>
      <div id="history-list" class="lk-card overflow-hidden min-w-0">
        <p class="p-6 text-center text-[var(--lk-text-muted)]" id="history-empty">Belum ada transaksi.</p>
      </div>
    </section>
  </main>

  <div id="toast" class="lk-toast hidden" role="status" aria-live="polite"></div>

  <script>
    window.LK_CONFIG = {
      url: "https://begnlasmgmobpyebzgsc.supabase.co",
      key: "sb_publishable_AFDwKgE47-P3Z6TyxKYp-A_j_5JaZtD"
    };
    window.LK_CACHE_BUST = Date.now();
  </script>
  <script src="js/theme.js?v=4"></script>
  <script src="js/ready.js?v=4"></script>
  <script type="module" src="js/supabase.js?v=4"></script>
  <script type="module" src="js/storage.js?v=6"></script>
  <script type="module" src="js/storage-backup.js?v=1"></script>
  <script type="module" src="js/realtime.js?v=1"></script>
  <script type="module" src="js/budget.js?v=1"></script>
  <script src="js/notify.js?v=6"></script>
  <script src="js/history.js?v=6"></script>
</body>
</html>
